<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIP Application — Luxury Standard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b0b0d;
      color: #e5e5e5;
      padding: 40px 20px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    #particleCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .audio-control {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(212, 175, 55, 0.3);
      color: #d4af37;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 100;
      backdrop-filter: blur(5px);
    }

    header {
      text-align: center;
      margin-bottom: 25px;
      max-width: 500px;
      margin-top: 20px;
      z-index: 2;
    }
    header .step-tag {
      text-transform: uppercase;
      letter-spacing: 4px;
      font-size: 10px;
      color: #a39382;
      display: block;
      margin-bottom: 8px;
    }
    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 38px;
      font-weight: 400;
      color: #ffffff;
      line-height: 1.2;
    }
    header h1 i {
      font-style: italic;
      color: #d4af37;
    }

    .card {
      background: rgba(18, 18, 22, 0.9);
      padding: 40px 30px;
      border-radius: 16px;
      max-width: 480px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(12px);
      z-index: 2;
      position: relative;
    }

    .progress-container {
      margin-bottom: 30px;
    }
    .progress-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      letter-spacing: 2px;
      color: #a39382;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .progress-bar-bg {
      width: 100%;
      height: 2px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      width: 25%;
      background: #d4af37;
      box-shadow: 0 0 10px #d4af37;
      transition: width 0.4s ease;
    }

    .step-content {
      display: none;
      animation: fadeIn 0.4s ease forwards;
    }
    .step-content.active {
      display: block;
    }

    .form-group {
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #a39382;
      margin-bottom: 10px;
    }
    input, textarea {
      width: 100%;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      font-size: 14px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: rgba(255, 255, 255, 0.03);
      color: #ffffff;
      transition: all 0.3s ease;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #d4af37;
      background-color: rgba(255, 255, 255, 0.06);
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.15);
    }

    .nav-buttons {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }
    .btn {
      flex: 1;
      padding: 14px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
    }
    .btn-secondary {
      background: transparent;
      color: #8c8c8c;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .btn-secondary:hover {
      color: #ffffff;
      border-color: #ffffff;
    }
    .btn-primary {
      background: linear-gradient(135deg, #d4af37 0%, #aa820a 100%);
      color: #0b0b0d;
      border: none;
      font-weight: 600;
    }
    .btn-primary:hover {
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
      transform: translateY(-1px);
    }

    .vip-card {
      display: none;
      border: 1px solid #d4af37;
      background: radial-gradient(circle at top left, rgba(212, 175, 55, 0.15), rgba(18, 18, 22, 0.95));
      padding: 30px 25px;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(212, 175, 55, 0.15);
      animation: zoomIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    .vip-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(212, 175, 55, 0.3);
      padding-bottom: 15px;
      margin-bottom: 20px;
    }
    .vip-title {
      font-family: 'Playfair Display', serif;
      color: #d4af37;
      font-size: 18px;
      letter-spacing: 1px;
    }
    .vip-badge {
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: rgba(212, 175, 55, 0.2);
      color: #d4af37;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid rgba(212, 175, 55, 0.4);
    }
    .vip-body p {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #8c8c8c;
      margin-bottom: 4px;
    }
    .vip-body h3 {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      color: #ffffff;
      margin-bottom: 16px;
      font-weight: 400;
    }
    .vip-footer {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      font-size: 10px;
      color: #a39382;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Luxe Footer Author */
    footer {
      margin-top: 40px;
      text-align: center;
      z-index: 2;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #66666e;
    }
    footer span {
      color: #d4af37;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      text-transform: none;
      font-size: 13px;
      letter-spacing: 1px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(10px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes zoomIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- Background Particles -->
  <canvas id="particleCanvas"></canvas>

  <!-- Audio Toggle -->
  <button id="audioToggle" class="audio-control">
    <span id="audioIcon">🔇</span> <span id="audioText">SOUND: OFF</span>
  </button>
  <audio id="bgMusic" loop preload="auto">
    <source src="https://cdn.pixabay.com/audio/2022/05/27/audio_1808fbf07a.mp3" type="audio/mpeg">
  </audio>

  <!-- Header -->
  <header>
    <span class="step-tag">— PRIVILEGE MEMBERSHIP —</span>
    <h1>Personal <i>&</i> Vision Application</h1>
  </header>

  <div class="card">
    
    <!-- Progress Indicator -->
    <div class="progress-container" id="progressBox">
      <div class="progress-labels">
        <span id="stepCounter">STEP 01 / 04</span>
        <span id="percentCounter">25%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
    </div>

    <!-- Form Steps -->
    <form id="userForm" action="https://formspree.io/f/xyekkppj" method="POST">
      
      <!-- STEP 1 -->
      <div class="step-content active" data-step="1">
        <div class="form-group">
          <label for="fullName">01. Full Name *</label>
          <input type="text" id="fullName" name="Full Name" placeholder="e.g. Eleanor Vance" required>
        </div>
        <div class="form-group">
          <label for="email">02. Email Address *</label>
          <input type="email" id="email" name="Email" placeholder="eleanor@example.com" required>
        </div>
      </div>

      <!-- STEP 2 -->
      <div class="step-content" data-step="2">
        <div class="form-group">
          <label for="phone">03. Phone Number</label>
          <input type="tel" id="phone" name="Phone" placeholder="+1 (555) 000-0000">
        </div>
        <div class="form-group">
          <label for="age">04. Age</label>
          <input type="number" id="age" name="Age" min="1" max="120" placeholder="e.g. 19">
        </div>
      </div>

      <!-- STEP 3 -->
      <div class="step-content" data-step="3">
        <div class="form-group">
          <label for="education">05. Educational Institution / Company</label>
          <input type="text" id="education" name="Educational Institution" placeholder="e.g. Columbia University">
        </div>
      </div>

      <!-- STEP 4 -->
      <div class="step-content" data-step="4">
        <div class="form-group">
          <label for="comment">06. Personal Vision & Goals</label>
          <textarea id="comment" name="Notes" rows="4" placeholder="Share your key goals or details..."></textarea>
        </div>
      </div>

      <!-- Step Navigation Controls -->
      <div class="nav-buttons" id="navButtons">
        <button type="button" class="btn btn-secondary" id="prevBtn" style="display: none;">Back</button>
        <button type="button" class="btn btn-primary" id="nextBtn">Continue</button>
        <button type="submit" class="btn btn-primary" id="submitBtn" style="display: none;">Complete Record</button>
      </div>

    </form>

    <!-- VIP PASS RESULT CARD -->
    <div class="vip-card" id="vipCard">
      <div class="vip-header">
        <span class="vip-title">✦ VIP PASS PORTAL</span>
        <span class="vip-badge">VERIFIED</span>
      </div>
      <div class="vip-body">
        <p>Holder Name</p>
        <h3 id="vipName">Eleanor Vance</h3>
        
        <p>Member Status</p>
        <h3 style="font-size: 15px; color: #d4af37;">APPROVED ACCESS</h3>
      </div>
      <div class="vip-footer">
        <span>ID: <span id="vipId">#882-990</span></span>
        <span id="vipDate">OCT 2026</span>
      </div>
    </div>

  </div>

  <!-- Author Footer -->
  <footer>
    Designed & Developed by <span>Ellé Ymanbekova</span> ✦
  </footer>

  <script>
    // --- 1. PARTICLES ---
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 0.5;
        this.speedY = -(Math.random() * 0.4 + 0.1);
        this.opacity = Math.random() * 0.5 + 0.2;
      }
      update() {
        this.y += this.speedY;
        if (this.y < 0) { this.y = canvas.height; this.x = Math.random() * canvas.width; }
      }
      draw() {
        ctx.fillStyle = `rgba(212, 175, 55, ${this.opacity})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    for (let i = 0; i < 40; i++) particles.push(new Particle());
    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // --- 2. STEP SYSTEM & PROGRESS BAR ---
    let currentStep = 1;
    const totalSteps = 4;

    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const submitBtn = document.getElementById('submitBtn');
    const stepCounter = document.getElementById('stepCounter');
    const percentCounter = document.getElementById('percentCounter');
    const progressFill = document.getElementById('progressFill');

    function triggerHaptic() {
      if (navigator.vibrate) navigator.vibrate(10);
    }

    function updateStepUI() {
      document.querySelectorAll('.step-content').forEach(step => {
        step.classList.remove('active');
        if (parseInt(step.dataset.step) === currentStep) {
          step.classList.add('active');
        }
      });

      const percent = Math.round((currentStep / totalSteps) * 100);
      progressFill.style.width = percent + '%';
      stepCounter.textContent = `STEP 0${currentStep} / 0${totalSteps}`;
      percentCounter.textContent = percent + '%';

      prevBtn.style.display = currentStep === 1 ? 'none' : 'block';
      if (currentStep === totalSteps) {
        nextBtn.style.display = 'none';
        submitBtn.style.display = 'block';
      } else {
        nextBtn.style.display = 'block';
        submitBtn.style.display = 'none';
      }
    }

    nextBtn.addEventListener('click', () => {
      const activeStepInputs = document.querySelectorAll(`.step-content[data-step="${currentStep}"] input`);
      let valid = true;
      activeStepInputs.forEach(input => {
        if (!input.checkValidity()) {
          input.reportValidity();
          valid = false;
        }
      });

      if (valid && currentStep < totalSteps) {
        triggerHaptic();
        currentStep++;
        updateStepUI();
      }
    });

    prevBtn.addEventListener('click', () => {
      if (currentStep > 1) {
        triggerHaptic();
        currentStep--;
        updateStepUI();
      }
    });

    // --- 3. AUDIO & JAZZ ---
    let audioCtx = null;
    let isSoundOn = false;
    const bgMusic = document.getElementById('bgMusic');
    bgMusic.volume = 0.35;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    document.getElementById('audioToggle').addEventListener('click', () => {
      triggerHaptic();
      initAudio();
      isSoundOn = !isSoundOn;
      if (isSoundOn) {
        document.getElementById('audioIcon').textContent = '🎷';
        document.getElementById('audioText').textContent = 'JAZZ: ON';
        bgMusic.play().catch(() => {});
      } else {
        document.getElementById('audioIcon').textContent = '🔇';
        document.getElementById('audioText').textContent = 'SOUND: OFF';
        bgMusic.pause();
      }
    });

    // --- 4. FORM SUBMIT & VIP PASS GENERATION ---
    const form = document.getElementById('userForm');
    const vipCard = document.getElementById('vipCard');
    const vipName = document.getElementById('vipName');
    const vipId = document.getElementById('vipId');
    const vipDate = document.getElementById('vipDate');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      triggerHaptic();

      const fullNameVal = document.getElementById('fullName').value || 'Eleanor Vance';
      const data = new FormData(event.target);

      const response = await fetch(event.target.action, {
        method: form.method,
        body: data,
        headers: { 'Accept': 'application/json' }
      });

      if (response.ok) {
        form.style.display = 'none';
        document.getElementById('progressBox').style.display = 'none';
        document.getElementById('navButtons').style.display = 'none';

        vipName.textContent = fullNameVal;
        vipId.textContent = '#' + Math.floor(100000 + Math.random() * 900000);
        
        const now = new Date();
        vipDate.textContent = now.toLocaleString('en-US', { month: 'short' }).toUpperCase() + ' ' + now.getFullYear();

        vipCard.style.display = 'block';
      } else {
        alert("Oops! There was a problem submitting your form");
      }
    });
  </script>

</body>
</html>
