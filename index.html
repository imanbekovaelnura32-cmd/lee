<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Application</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b0b0d;
      color: #e5e5e5;
      padding: 50px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      background-image: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.05) 0%, transparent 70%);
      position: relative;
    }

    /* Sound Control Button */
    .audio-control {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(212, 175, 55, 0.3);
      color: #d4af37;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .audio-control:hover {
      background: rgba(212, 175, 55, 0.1);
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
    }

    /* Luxury Header */
    header {
      text-align: center;
      margin-bottom: 45px;
      max-width: 500px;
      margin-top: 20px;
    }
    header .step-tag {
      text-transform: uppercase;
      letter-spacing: 4px;
      font-size: 11px;
      color: #a39382;
      font-weight: 500;
      display: block;
      margin-bottom: 12px;
    }
    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 42px;
      font-weight: 400;
      color: #ffffff;
      letter-spacing: -0.5px;
      line-height: 1.2;
    }
    header h1 i {
      font-style: italic;
      color: #d4af37;
      font-weight: 400;
    }
    header p {
      font-size: 13px;
      color: #8c8c8c;
      margin-top: 12px;
      font-weight: 300;
      letter-spacing: 0.5px;
    }

    /* Dark Luxury Card */
    .card {
      background: rgba(18, 18, 22, 0.8);
      padding: 45px 35px;
      border-radius: 16px;
      max-width: 480px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #a39382;
      margin-bottom: 8px;
      font-weight: 500;
    }
    input, textarea {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      font-size: 14px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: rgba(255, 255, 255, 0.03);
      color: #ffffff;
      transition: all 0.3s ease;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #d4af37;
      background-color: rgba(255, 255, 255, 0.06);
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.15);
    }
    input::placeholder, textarea::placeholder {
      color: #55555e;
      font-weight: 300;
    }

    /* Button */
    button[type="submit"] {
      width: 100%;
      background: linear-gradient(135deg, #2a2a30 0%, #151518 100%);
      color: #ffffff;
      border: 1px solid rgba(212, 175, 55, 0.4);
      padding: 16px;
      margin-top: 10px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    button[type="submit"]:hover {
      background: #d4af37;
      color: #0b0b0d;
      border-color: #d4af37;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
    }

    /* Success Message */
    .result {
      margin-top: 24px;
      padding: 16px;
      background: rgba(212, 175, 55, 0.05);
      border: 1px solid rgba(212, 175, 55, 0.3);
      color: #d4af37;
      border-radius: 8px;
      display: none;
      text-align: center;
      font-size: 13px;
      letter-spacing: 1px;
      font-family: 'Playfair Display', serif;
    }
  </style>
</head>
<body>

  <!-- Audio Toggle Button -->
  <button id="audioToggle" class="audio-control">
    <span id="audioIcon">🔇</span> <span id="audioText">SOUND: OFF</span>
  </button>

  <!-- Chic Header -->
  <header>
    <span class="step-tag">— STEP 01 —</span>
    <h1>Personal <i>&</i> Educational Profile</h1>
    <p>Please enter your information to submit the record.</p>
  </header>

  <!-- Dark Card -->
  <div class="card">
    <form id="userForm" action="https://formspree.io/f/xyekkppj" method="POST">
      
      <div class="form-group">
        <label for="fullName">Full Name *</label>
        <input type="text" id="fullName" name="Full Name" placeholder="e.g. Eleanor Vance" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address *</label>
        <input type="email" id="email" name="Email" placeholder="eleanor@example.com" required>
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="Phone" placeholder="+1 (555) 000-0000">
      </div>

      <div class="form-group">
        <label for="age">Age</label>
        <input type="number" id="age" name="Age" min="1" max="120" placeholder="e.g. 19">
      </div>

      <div class="form-group">
        <label for="education">Educational Institution</label>
        <input type="text" id="education" name="Educational Institution" placeholder="e.g. Columbia University / High School">
      </div>

      <div class="form-group">
        <label for="comment">Notes / Additional Info</label>
        <textarea id="comment" name="Notes" rows="3" placeholder="Enter details..."></textarea>
      </div>

      <button type="submit">Submit Application</button>
    </form>

    <div id="successMessage" class="result">
      ✦ Application successfully submitted
    </div>
  </div>

  <script>
    // --- Audio System (Web Audio API) ---
    let audioCtx = null;
    let isSoundOn = false;
    let bgOscillator = null;
    let bgGain = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    // Click Sound
    function playClickSound() {
      if (!isSoundOn || !audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.05);
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    }

    // Success Fanfare Sound
    function playSuccessSound() {
      if (!isSoundOn || !audioCtx) return;
      const notes = [261.63, 329.63, 392.00, 523.25]; // C E G C
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime + idx * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.1 + 0.6);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + idx * 0.1);
        osc.stop(audioCtx.currentTime + idx * 0.1 + 0.6);
      });
    }

    // Background Ambient Sound
    function startAmbient() {
      if (!audioCtx) return;
      bgOscillator = audioCtx.createOscillator();
      bgGain = audioCtx.createGain();
      bgOscillator.type = 'sine';
      bgOscillator.frequency.value = 110; // Low A note
      bgGain.gain.setValueAtTime(0.01, audioCtx.currentTime);
      bgOscillator.connect(bgGain);
      bgGain.connect(audioCtx.destination);
      bgOscillator.start();
    }

    function stopAmbient() {
      if (bgOscillator) {
        bgOscillator.stop();
        bgOscillator = null;
      }
    }

    // Toggle Audio Button
    const audioBtn = document.getElementById('audioToggle');
    const audioIcon = document.getElementById('audioIcon');
    const audioText = document.getElementById('audioText');

    audioBtn.addEventListener('click', () => {
      initAudio();
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      isSoundOn = !isSoundOn;

      if (isSoundOn) {
        audioIcon.textContent = '🔊';
        audioText.textContent = 'SOUND: ON';
        audioBtn.style.borderColor = '#d4af37';
        startAmbient();
        playClickSound();
      } else {
        audioIcon.textContent = '🔇';
        audioText.textContent = 'SOUND: OFF';
        audioBtn.style.borderColor = 'rgba(212, 175, 55, 0.3)';
        stopAmbient();
      }
    });

    // Add click audio to all inputs
    document.querySelectorAll('input, textarea, button').forEach(element => {
      element.addEventListener('focus', playClickSound);
      element.addEventListener('click', playClickSound);
    });

    // --- Form Handler ---
    const form = document.getElementById('userForm');
    const successMessage = document.getElementById('successMessage');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const data = new FormData(event.target);
      
      const response = await fetch(event.target.action, {
        method: form.method,
        body: data,
        headers: {
            'Accept': 'application/json'
        }
      });

      if (response.ok) {
        playSuccessSound();
        successMessage.style.display = 'block';
        form.reset();
        setTimeout(() => {
          successMessage.style.display = 'none';
        }, 5000);
      } else {
        alert("Oops! There was a problem submitting your form");
      }
    });
  </script>

</body>
</html>
