<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Application</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b0b0d;
      color: #e5e5e5;
      padding: 50px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* Particles Background Canvas */
    #particleCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Sound Control Button */
    .audio-control {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(212, 175, 55, 0.3);
      color: #d4af37;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 100;
      backdrop-filter: blur(5px);
    }
    .audio-control:hover {
      background: rgba(212, 175, 55, 0.1);
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.25);
    }

    /* Luxury Header */
    header {
      text-align: center;
      margin-bottom: 45px;
      max-width: 500px;
      margin-top: 20px;
      z-index: 2;
    }
    header .step-tag {
      text-transform: uppercase;
      letter-spacing: 4px;
      font-size: 11px;
      color: #a39382;
      font-weight: 500;
      display: block;
      margin-bottom: 12px;
    }
    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 42px;
      font-weight: 400;
      color: #ffffff;
      letter-spacing: -0.5px;
      line-height: 1.2;
    }
    header h1 i {
      font-style: italic;
      color: #d4af37;
      font-weight: 400;
    }
    header p {
      font-size: 13px;
      color: #8c8c8c;
      margin-top: 12px;
      font-weight: 300;
      letter-spacing: 0.5px;
    }

    /* Dark Luxury Card */
    .card {
      background: rgba(18, 18, 22, 0.85);
      padding: 45px 35px;
      border-radius: 16px;
      max-width: 480px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      z-index: 2;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #a39382;
      margin-bottom: 8px;
      font-weight: 500;
    }
    input, textarea {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      font-size: 14px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: rgba(255, 255, 255, 0.03);
      color: #ffffff;
      transition: all 0.3s ease;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #d4af37;
      background-color: rgba(255, 255, 255, 0.06);
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.15);
    }
    input::placeholder, textarea::placeholder {
      color: #55555e;
      font-weight: 300;
    }

    /* Button */
    button[type="submit"] {
      width: 100%;
      background: linear-gradient(135deg, #2a2a30 0%, #151518 100%);
      color: #ffffff;
      border: 1px solid rgba(212, 175, 55, 0.4);
      padding: 16px;
      margin-top: 10px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    button[type="submit"]:hover {
      background: #d4af37;
      color: #0b0b0d;
      border-color: #d4af37;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
    }

    /* Success Message */
    .result {
      margin-top: 24px;
      padding: 16px;
      background: rgba(212, 175, 55, 0.08);
      border: 1px solid rgba(212, 175, 55, 0.4);
      color: #d4af37;
      border-radius: 8px;
      display: none;
      text-align: center;
      font-size: 13px;
      letter-spacing: 1px;
      font-family: 'Playfair Display', serif;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Particles Background -->
  <canvas id="particleCanvas"></canvas>

  <!-- Audio Toggle Button -->
  <button id="audioToggle" class="audio-control">
    <span id="audioIcon">🔇</span> <span id="audioText">SOUND: OFF</span>
  </button>

  <!-- Background Jazz Audio -->
  <audio id="bgMusic" loop preload="auto">
    <source src="https://cdn.pixabay.com/download/audio/2022/11/06/audio_40446b52a5.mp3?filename=smooth-jazz-125345.mp3" type="audio/mpeg">
  </audio>

  <!-- Chic Header -->
  <header>
    <span class="step-tag">— STEP 01 —</span>
    <h1>Personal <i>&</i> Educational Profile</h1>
    <p>Please enter your information to submit the record.</p>
  </header>

  <!-- Dark Card -->
  <div class="card">
    <form id="userForm" action="https://formspree.io/f/xyekkppj" method="POST">
      
      <div class="form-group">
        <label for="fullName">Full Name *</label>
        <input type="text" id="fullName" name="Full Name" placeholder="e.g. Eleanor Vance" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address *</label>
        <input type="email" id="email" name="Email" placeholder="eleanor@example.com" required>
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="Phone" placeholder="+1 (555) 000-0000">
      </div>

      <div class="form-group">
        <label for="age">Age</label>
        <input type="number" id="age" name="Age" min="1" max="120" placeholder="e.g. 19">
      </div>

      <div class="form-group">
        <label for="education">Educational Institution</label>
        <input type="text" id="education" name="Educational Institution" placeholder="e.g. Columbia University / High School">
      </div>

      <div class="form-group">
        <label for="comment">Notes / Additional Info</label>
        <textarea id="comment" name="Notes" rows="3" placeholder="Enter details..."></textarea>
      </div>

      <button type="submit">Submit Application</button>
    </form>

    <div id="successMessage" class="result">
      ✦ Application successfully submitted
    </div>
  </div>

  <script>
    // --- 1. GOLDEN PARTICLES CANVAS ---
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 0.5;
        this.speedY = -(Math.random() * 0.4 + 0.1);
        this.opacity = Math.random() * 0.5 + 0.2;
      }
      update() {
        this.y += this.speedY;
        if (this.y < 0) {
          this.y = canvas.height;
          this.x = Math.random() * canvas.width;
        }
      }
      draw() {
        ctx.fillStyle = `rgba(212, 175, 55, ${this.opacity})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let i = 0; i < 45; i++) {
      particles.push(new Particle());
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // --- 2. AUDIO & TACTILE SOUNDS ---
    let audioCtx = null;
    let isSoundOn = false;
    const bgMusic = document.getElementById('bgMusic');
    bgMusic.volume = 0.35; // Комфортная громкость

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playClickSound() {
      if (!isSoundOn || !audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    }

    function playSuccessChord() {
      if (!isSoundOn || !audioCtx) return;
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime + idx * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.1 + 0.7);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + idx * 0.1);
        osc.stop(audioCtx.currentTime + idx * 0.1 + 0.7);
      });
    }

    // Toggle Button
    const audioBtn = document.getElementById('audioToggle');
    const audioIcon = document.getElementById('audioIcon');
    const audioText = document.getElementById('audioText');

    audioBtn.addEventListener('click', () => {
      initAudio();
      isSoundOn = !isSoundOn;

      if (isSoundOn) {
        audioIcon.textContent = '🎷';
        audioText.textContent = 'JAZZ: ON';
        audioBtn.style.borderColor = '#d4af37';
        bgMusic.play().catch(() => {});
        playClickSound();
      } else {
        audioIcon.textContent = '🔇';
        audioText.textContent = 'SOUND: OFF';
        audioBtn.style.borderColor = 'rgba(212, 175, 55, 0.3)';
        bgMusic.pause();
      }
    });

    document.querySelectorAll('input, textarea, button').forEach(element => {
      element.addEventListener('focus', playClickSound);
      element.addEventListener('click', playClickSound);
    });

    // --- 3. FORM HANDLER ---
    const form = document.getElementById('userForm');
    const successMessage = document.getElementById('successMessage');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const data = new FormData(event.target);
      
      const response = await fetch(event.target.action, {
        method: form.method,
        body: data,
        headers: {
            'Accept': 'application/json'
        }
      });

      if (response.ok) {
        playSuccessChord();
        successMessage.style.display = 'block';
        form.reset();
        setTimeout(() => {
          successMessage.style.display = 'none';
        }, 5000);
      } else {
        alert("Oops! There was a problem submitting your form");
      }
    });
  </script>

</body>
</html>
